<head>

<title>팀 분석</title>
<style>
:root{
  /* 11-25 겉모습 벤치마킹: Figma 「Online Bike Shopping App」 색(바탕 #242C3B, 카드 #353F54, 파랑 그라데이션 #34C8E8→#4E4AF2) */
  --bg:#242C3B; --card:#353F54; --line:rgba(255,255,255,.06); --fg:#F4F6FA; --mute:#A9B0BE;
  --accent:#3D8BEA; --accent-ink:#fff; --bad:#ff6b8a; --grad:linear-gradient(135deg,#34C8E8 0%,#4E4AF2 100%);
  --cardbg:linear-gradient(160deg,rgba(53,63,84,.92),rgba(38,46,62,.92)); --shadow:0 18px 32px rgba(10,14,22,.4);
  --font:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --bar:48px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(118deg,#242C3B 0%,#242C3B 54%,rgba(52,140,200,.6) 54.05%,rgba(68,98,226,.82) 100%),#242C3B;background-attachment:fixed;color:var(--fg);font-family:var(--font);margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding-block:calc(40px + env(safe-area-inset-top,0px)) 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;font-weight:800;margin:0}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px}
input[type=password]{background:#1E2532;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
.btn{background:var(--grad);color:#fff;border:0;border-radius:12px;box-shadow:0 8px 18px rgba(62,110,236,.4);padding:12px;font:800 15px var(--font);cursor:pointer}
.btn:disabled{opacity:.6}
.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
.msg{color:var(--bad);font-size:13px;min-height:1em}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* 연령: 세로로 한 줄씩, 큰 상자 + 굵고 큰 글자(11-25 사용자 「세로로 나열」 「박스 크기를 조금 더 크게」 「텍스트 굵게 크기 바꾸고」) */
.age{display:flex;flex-direction:column;gap:12px}
.age button{background:var(--cardbg);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--fg);font:800 24px var(--font);letter-spacing:.02em;
  padding:26px 16px;border-radius:22px;cursor:pointer;text-align:center}
.age button:hover{border-color:var(--accent)}
.age button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 22px rgba(62,110,236,.45)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* 팀 카드: 왼쪽 로고 + 팀 이름, 여백 없이 채움(11-25 사용자 B안 「박스 여백을 남기지 않도록 채우고」) */
/* 11-25 팀 카드 정렬(사용자 「최신순과 이름순」, 최신순 = 최근 분석순) */
.tsort{display:flex;gap:6px;justify-content:flex-end;margin:0 0 10px}
.tsort button{background:var(--cardbg);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tsort button[aria-pressed="true"]{color:#fff;background:var(--grad);border-color:transparent;font-weight:700}
.team{background:var(--cardbg);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 12px;min-height:84px;
  display:flex;align-items:center;gap:10px;text-align:left;font:800 19px var(--font);color:var(--fg);cursor:pointer;min-width:0}
.team img{width:52px;height:52px;flex:none;object-fit:contain}
.team span{flex:1;min-width:0;white-space:nowrap;line-height:1.2}
.team:hover{border-color:var(--accent)}
.hint{grid-column:1/-1;color:var(--mute);text-align:center;margin:8px 0}
.foot{display:flex;justify-content:flex-end}
.link{background:none;border:0;color:var(--mute);font:13px var(--font);text-decoration:underline;cursor:pointer}
/* 팀 화면: 위 막대 + 대시보드(틀) */
#view{position:fixed;inset:0;background:var(--bg)}
.bar{position:absolute;left:0;right:0;top:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{background:var(--cardbg);border:1px solid var(--line);color:var(--fg);border-radius:10px;height:40px;padding:0 16px;font:800 15px var(--font);cursor:pointer;white-space:nowrap}
.back:hover{border-color:var(--accent)}
/* 휴대폰(760px 이하): 위 막대를 없애고, 대시보드 아래 탭 막대 바로 위에 「홈」「팀 목록」 막대를 넣는다
   (11-25 사용자 「상위 버튼이 누르기 힘든 거 같은데, 팀 목록으로 가는 버튼도. 그리고 홈으로 가는 버튼도」) */
@media (max-width:760px){ .bar{display:none} #frame{top:0;height:100%} .loading{inset:0} }
.bar b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bar) + env(safe-area-inset-top,0px));width:100%;height:calc(100% - var(--bar) - env(safe-area-inset-top,0px));border:0;background:var(--bg)}
.loading{position:absolute;inset:var(--bar) 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--mute)}
</style>
</head>

  </section>
</div>

<div id="view" hidden>
  <div class="bar"><button class="back" id="goHome" type="button">⌂ 홈</button><button class="back" id="back" type="button">☰ 팀 목록</button><b id="tname"></b></div>
  <div class="loading" id="loading">여는 중…</div>
</div>

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY_STORE = 'team-hub-key-v1';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null, TEAMS = [], age = null, blobUrl = null;
// 대시보드 틀(iframe)은 팀을 열 때마다 새로 만들고 닫을 때 없앤다(앞 팀의 화면·기억이 남지 않게).
// 뒤로 가기: 휴대폰 뒤로 몸짓은 대시보드 안 탭 이동을 차례로 되돌리다가 목록으로 돌아온다.
//   「← 팀 목록」 버튼은 기록을 따지지 않고 바로 목록으로 간다(틀 안 기록은 브라우저가 지우지 않아 횟수를 셀 수 없음, 11-25 시험)
function newFrame() {
  dropFrame();
  const f = document.createElement('iframe'); f.id = 'frame'; f.title = '팀 대시보드'; f.style.visibility = 'hidden';
  $('view').appendChild(f); return f;
}
function dropFrame() { const f = $('frame'); if (f) f.remove(); }

async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.it, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function dec(buf) {   // 앞 12바이트 = iv
  const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0, 12)}, KEY, u.slice(12));
}
async function unlockWith(key) {
  KEY = key;
  TEAMS = JSON.parse(new TextDecoder().decode(await dec(b64(P.m))));
  $('lock').hidden = true; $('pick').hidden = false; drawPick();
  // 새 판을 받아 온 뒤라면 열려던 팀을 바로 연다(이름·연령으로 찾음, 한 번만)
  let want = null; try { want = JSON.parse(sessionStorage.getItem('hub-open') || 'null'); sessionStorage.removeItem('hub-open'); } catch (e) {}
  if (want) { const i = TEAMS.findIndex(x => x.name === want.name && x.age === want.age); if (i >= 0) { age = want.age; drawPick(); openTeam(i, true); } }
}
// 주소 끝 ?r=… 은 새로 받아 오기용이라 지움(공유·즐겨찾기 주소는 그대로)
if (/[?&]r=\d+/.test(location.search)) history.replaceState(history.state, '', location.pathname + location.hash);
function saved() { try { return JSON.parse(localStorage.getItem(KEY_STORE) || 'null'); } catch (e) { return null; } }

$('lock').addEventListener('submit', async e => {
  e.preventDefault();
  $('msg').textContent = ''; $('open').disabled = true; $('open').textContent = '확인 중…';
  try {
    const key = await derive($('pw').value);
    await unlockWith(key);
    if ($('remember').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try { localStorage.setItem(KEY_STORE, JSON.stringify({s:P.s, k:btoa(String.fromCharCode(...raw))})); } catch (e) {}
    }
    $('pw').value = '';
  } catch (err) {
    KEY = null; $('msg').textContent = '비밀번호가 맞지 않습니다.';
  }
  $('open').disabled = false; $('open').textContent = '열기';
});

function drawPick() {
  const ages = ['U-18', 'U-15'].filter(a => TEAMS.some(t => t.age === a));
  $('ages').innerHTML = ages.map(a => `<button type="button" aria-pressed="${a === age}">${a}</button>`).join('');
  $('ages').querySelectorAll('button').forEach(b => b.onclick = () => { age = b.textContent; drawPick(); });
  $('tsort').hidden = !age;
  if (!age) { $('teams').innerHTML = '<p class="hint">연령을 고르세요</p>'; return; }
  let tsort = 'new'; try { tsort = localStorage.getItem('team-hub-sort') || 'new'; } catch (e) {}
  $('tsort').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.s === tsort);
    b.onclick = () => { try { localStorage.setItem('team-hub-sort', b.dataset.s); } catch (e) {} drawPick(); }; });
  const byName = (a, b) => a.name.localeCompare(b.name, 'ko');
  const list = TEAMS.map((t, i) => [t, i]).filter(([t]) => t.age === age)
    .sort(([a], [b]) => tsort === 'name' ? byName(a, b) : (String(b.d || '').localeCompare(String(a.d || '')) || byName(a, b)));
  $('teams').innerHTML = list.map(([t, i]) => `<button type="button" class="team" data-i="${i}"></button>`).join('');
  $('teams').querySelectorAll('.team').forEach(b => {
    const t = TEAMS[b.dataset.i];
    if (t.logo) { const im = new Image(); im.src = t.logo; im.alt = ''; b.appendChild(im); }
    const sp = document.createElement('span'); sp.textContent = t.name; b.appendChild(sp);
    b.onclick = () => openTeam(+b.dataset.i, true);
  });
  fitNames();
}

// 긴 팀 이름도 한 줄에 들어가도록 글자를 줄이되, 카드끼리 글자 크기는 같게 맞춘다(가장 작은 크기, 최소 14px)
function fitNames() {
  const sps = [...document.querySelectorAll('.team span')];
  let min = 19;
  sps.forEach(sp => {
    let fs = 19; sp.style.fontSize = fs + 'px';
    while (sp.scrollWidth > sp.clientWidth && fs > 14) sp.style.fontSize = (--fs) + 'px';
    min = Math.min(min, fs);
  });
  sps.forEach(sp => sp.style.fontSize = min + 'px');
}
window.addEventListener('resize', () => { if (!$('pick').hidden) fitNames(); });
async function openTeam(i, push) {
  const t = TEAMS[i];
  if (push) history.pushState({team:i}, '');
  $('tname').textContent = `${t.name} ${t.age}`;
  $('home').hidden = true; $('view').hidden = false; $('loading').hidden = false;
  const frame = newFrame();
  try {
    const res = await fetch(t.f, {cache:'no-cache'});
    // 11-25 사용자 「응, 고쳐 줘」: 게시 직후 휴대폰이 저장해 둔 옛 첫 화면을 쓰면 옛 팀 파일을 찾다가 404 →
    //   한 번만 첫 화면을 새로 받아 오고(주소 끝 ?r=시각으로 저장본 건너뜀), 열려던 팀을 다시 연다
    if (res.status === 404) {
      let tried = ''; try { tried = sessionStorage.getItem('hub-reload') || ''; } catch (e) {}
      if (tried !== t.f) {
        try { sessionStorage.setItem('hub-reload', t.f); sessionStorage.setItem('hub-open', JSON.stringify({name:t.name, age:t.age})); } catch (e) {}
        $('loading').textContent = '새 판을 받아 오는 중…';
        location.replace(location.pathname + '?r=' + Date.now()); return;
      }
    }
    if (!res.ok) throw new Error(res.status);
    const html = withHubNav(new TextDecoder().decode(await dec(await res.arrayBuffer())));
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
    frame.onload = () => { $('loading').hidden = true; frame.style.visibility = 'visible'; };
    frame.contentWindow.location.replace(blobUrl);   // 첫 열기는 기록에 남기지 않음
  } catch (err) {
    $('loading').textContent = '대시보드를 열지 못했습니다. 새로고침 후 다시 시도하세요.';
  }
}
function showHome() {
  dropFrame(); $('view').hidden = true; $('home').hidden = false; $('loading').textContent = '여는 중…';
}
// 홈 = 연령을 고르기 전 첫 화면, 팀 목록 = 지금 고른 연령의 팀 카드
function goList() { showHome(); drawPick(); history.pushState({home:1}, ''); }
function goHome() { age = null; goList(); }
$('back').onclick = goList;
$('goHome').onclick = goHome;
// 대시보드 안 아래 막대에서 온 신호(지금 열린 틀에서 온 것만 받음)
window.addEventListener('message', e => {
  const f = $('frame');
  if (!f || e.source !== f.contentWindow || !e.data) return;
  if (e.data.hub === 'home') goHome(); else if (e.data.hub === 'list') goList();
});
// 휴대폰용 아래 메뉴(11-25 사용자 「B안」): 통합판 틀로 만든 대시보드는 메뉴가 이미 들어 있다(src\phone_nav.html).
// 옛 판(통합판 틀 밖에서 만든 파일)에만 같은 메뉴를 끝에 붙인다. 내용은 빌드 때 phone_nav.html에서 채움
const HUBNAV = "<!-- 출처: 팀분석_통합 hub_template.html HUBNAV B안(11-25) — 통합판 틀 안으로 옮김. 겉모습은 Figma 「Online Bike Shopping App」 탭 막대·분류 버튼 벤치마킹(11-25) -->\n<style>/* 휴대폰 아래 메뉴(11-25 사용자 「B안」): 한 줄 5칸. 홈·팀 목록은 아이콘만, 경기·스쿼드·더보기 */\n#hubnav,#hubmore{display:none}\n@media (max-width:760px){\n nav{display:none!important}\n #hubnav{position:fixed;left:0;right:0;bottom:0;z-index:31;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;\n   padding:6px max(10px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left));background:rgba(36,42,55,.97);border-top:1px solid rgba(255,255,255,.05);box-shadow:0 -12px 24px rgba(10,14,22,.35);border-radius:22px 22px 0 0}\n .solo #hubnav{grid-template-columns:repeat(3,1fr)} .solo #hubnav [data-go]{display:none}\n #hubnav button,#hubmore button{border-radius:16px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(160deg,#353F54,#2A3243);color:#C9CFDA;box-shadow:0 8px 16px rgba(10,14,22,.35);font-family:inherit;font-weight:800;cursor:pointer;\n   display:flex;align-items:center;justify-content:center;padding:0}\n #hubnav button{height:54px;flex-direction:column;gap:1px;font-size:14px;line-height:1.1;letter-spacing:-.02em}   /* 11-25 사용자 「텍스트를 더 키우자. 여백은 최소화」: 11→14px, 아이콘 26→22px, 위아래 여백 줄임 */\n #hubnav svg{width:22px;height:22px;stroke:#C9CFDA;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}\n #hubnav button:active,#hubmore button:active{background:#3A4560}\n #hubnav button.on{background:linear-gradient(135deg,#34C8E8,#4E4AF2);color:#fff;border-color:transparent} #hubnav button.on svg{stroke:#fff}\n #hubmore{position:fixed;inset:0;z-index:32;background:rgba(0,0,0,.55);display:none}\n #hubmore.open{display:block}\n #hubmore .sheet{position:absolute;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:#242A37;border-top:1px solid rgba(255,255,255,.06);border-radius:22px 22px 0 0;\n   padding:14px 12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}\n #hubmore .sheet b{grid-column:1/-1;color:#9c9c9d;font-size:13px;font-weight:600}\n #hubmore button{height:56px;font-size:17px;border-radius:16px}\n #hubmore button.on{background:linear-gradient(135deg,#34C8E8,#4E4AF2);color:#fff;border-color:transparent}\n main,#app{padding-bottom:96px!important}\n /* 11-25 사용자 「맨 아래 박스 색상은 조금 다르게 … 구분되게」 「②로 해 줘」: 이 팀을 떠나는 버튼(홈·팀 목록)과 이 팀 안에서 옮기는 버튼(경기·스쿼드·더보기)을 다른 모양으로 */\n #hubnav button[data-go]{background:transparent;border:1.5px solid rgba(201,207,218,.35);box-shadow:none}\n #hubnav button[data-go] svg{stroke:#AEB6C4;width:26px;height:26px}   /* 글자 없는 홈·팀 목록은 아이콘 크기 유지 */\n #hubnav button[data-tab]:not(.on),#hubnav button[data-more]:not(.on){background:linear-gradient(160deg,#33456E,#283655);border-color:rgba(120,150,220,.25)}\n}<\/style>\n<div id=\"hubnav\"><button type=\"button\" data-go=\"home\" aria-label=\"홈\" title=\"홈\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 11l9-8 9 8\"/><path d=\"M5 10v10h5v-6h4v6h5V10\"/><\/svg><\/button><button type=\"button\" data-go=\"list\" aria-label=\"팀 목록\" title=\"팀 목록\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"3\" y=\"13.5\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><\/svg><\/button><button type=\"button\" data-tab=\"경기\" aria-label=\"경기\" title=\"경기\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/><\/svg><span>경기<\/span><\/button><button type=\"button\" data-tab=\"스쿼드\" aria-label=\"스쿼드\" title=\"스쿼드\"><svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5\"/><circle cx=\"17\" cy=\"9\" r=\"2.6\"/><path d=\"M16.5 14.2c2.8.2 4.5 2.2 4.5 5\"/><\/svg><span>스쿼드<\/span><\/button><button type=\"button\" data-more=\"\" aria-label=\"더보기\" title=\"더보기\"><svg viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.6\"/><circle cx=\"12\" cy=\"12\" r=\"1.6\"/><circle cx=\"19\" cy=\"12\" r=\"1.6\"/><\/svg><span>더보기<\/span><\/button><\/div>\n<div id=\"hubmore\"><div class=\"sheet\"><b>다른 메뉴<\/b><button type=\"button\" data-tab=\"개요\">개요<\/button><button type=\"button\" data-tab=\"대회\">대회·리그<\/button><button type=\"button\" data-tab=\"상대\">상대 팀<\/button><button type=\"button\" data-tab=\"실점\">득점·실점<\/button><button type=\"button\" data-tab=\"자료\">자료<\/button><\/div><\/div>\n<script>(function(){\nif(window.parent===window) document.documentElement.classList.add('solo');   /* 통합판 밖(단독 파일): 홈·팀 목록 없음 */\nvar b=document.getElementById('hubnav'), more=document.getElementById('hubmore');\nfunction cur(){ var h=decodeURIComponent(location.hash.slice(1)).split('/')[0]||'개요'; return h==='선수'?'스쿼드':h; }\nfunction mark(){ var c=cur(); document.querySelectorAll('[data-tab]').forEach(function(x){ x.classList.toggle('on', x.dataset.tab===c); });\n  var m=b.querySelector('[data-more]'); if(m) m.classList.toggle('on', ['개요','대회','상대','실점','자료'].indexOf(c)>=0); }\nfunction closeMore(){ if(more) more.classList.remove('open'); }\ndocument.addEventListener('click',function(e){ var g=e.target.closest('#hubnav button,#hubmore button'); if(!g){ if(more&&e.target===more) closeMore(); return; }\n  if(g.dataset.go){ parent.postMessage({hub:g.dataset.go},'*'); return; }\n  if(g.dataset.more!==undefined){ more.classList.toggle('open'); return; }\n  if(g.dataset.tab){ closeMore(); location.hash=g.dataset.tab; scrollTo(0,0); } });\naddEventListener('hashchange',mark); mark();\n})();<\/script>\n";
function withHubNav(html) {
  if (html.includes('id="hubnav"')) return html;
  const i = html.lastIndexOf('</body>');
  return i < 0 ? html + HUBNAV : html.slice(0, i) + HUBNAV + html.slice(i);
}
window.addEventListener('popstate', e => { if (!(e.state && e.state.team != null)) showHome(); });
// 11-25 사용자 「프로그램을 닫았다가 다시 열면, 처음 위치로 가지 않고 기존 위치에 있어」 「5분으로 해 줘」:
//   휴대폰 브라우저는 닫아도 페이지를 보관해 두었다가 그대로 보여 줌 → 보관본을 다시 보여 줄 때, 또는 5분 이상 떠나 있다 돌아오면 처음 위치(연령 고르기)로
const AWAY_MS = 5 * 60 * 1000;
let HIDDEN_AT = 0;
function resetToStart() {
  if (!KEY) return;                       // 아직 잠겨 있으면 그대로
  age = null; showHome(); drawPick();
  history.replaceState(null, '', location.pathname);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { HIDDEN_AT = Date.now(); return; }
  if (HIDDEN_AT && Date.now() - HIDDEN_AT >= AWAY_MS) resetToStart();
  HIDDEN_AT = 0;
});
window.addEventListener('pageshow', e => { if (e.persisted) resetToStart(); });
$('forget').onclick = () => { try { localStorage.removeItem(KEY_STORE); } catch (e) {} location.reload(); };

(async () => {   // 「이 기기에서 기억」이 켜져 있으면 바로 연다
  const s = saved();
  if (!s || s.s !== P.s) return;
  try {
    const key = await crypto.subtle.importKey('raw', b64(s.k), {name:'AES-GCM'}, true, ['decrypt']);
    await unlockWith(key);
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
})();
</script>
</body>
</html>
